<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Understudy Audit</title>
<meta name="description" content="On-device business audits with opt-in nearby restaurant research." />
<meta name="theme-color" content="#0F6E5A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Audit" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="./meetings.css" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/audit-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/audit-apple-180.png" />
<style>
  :root{
    --paper:#F6F4EF;--card:#FFFFFF;--ink:#1B2A2E;--ink-2:#556361;--ink-3:#8A938F;
    --line:#E4DFD6;--line-2:#EDE9E1;--save:#0F6E5A;--save-lite:#E1EDE8;--leak:#C2673B;--leak-lite:#F4E6DC;--gold:#B7902F;
    --shadow:0 1px 0 rgba(27,42,46,.04),0 18px 40px -24px rgba(27,42,46,.28);
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--save)}
  #app{min-height:100%}
  /* ---------- app chrome ---------- */
  .appbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px clamp(16px,5vw,28px);
    padding-top:max(14px,env(safe-area-inset-top));background:rgba(246,244,239,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .appbar .brand{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .appbar h1{font-family:var(--serif);font-size:1.3rem;margin:0;font-weight:600}
  .appbar .sp{flex:1}
  .wrap{max-width:760px;margin:0 auto;padding:clamp(16px,5vw,28px)}
  .btn{font-family:var(--sans);font-size:.95rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:.6rem 1rem;border-radius:11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.45rem}
  .btn:hover{border-color:var(--save);color:var(--save)}
  .btn.primary{background:var(--save);color:#fff;border-color:var(--save)}
  .btn.primary:hover{color:#fff;filter:brightness(1.05)}
  .btn.ghost{border-color:transparent;background:transparent;padding:.5rem .6rem}
  .btn.danger:hover{border-color:var(--leak);color:var(--leak)}
  .btn:focus-visible,.seg button:focus-visible,.pnav button:focus-visible,.pexit:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--ink-3);font-size:.9rem}
  .notice{border-left:3px solid var(--save);padding:10px 12px;background:var(--save-lite);color:var(--ink-2);font-size:.88rem;margin:12px 0}
  .notice.warn{border-left-color:var(--gold);background:#F4EEDC}.notice.error{border-left-color:var(--leak);background:var(--leak-lite);color:#7D3F24}
  .search-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:14px}
  .search-tools .btn{min-width:92px;justify-content:center}
  .discover-controls{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:10px}
  .discover-controls label{flex:1;min-width:130px;margin:0}
  .status{min-height:24px;margin:14px 0 4px;color:var(--ink-2);font-size:.9rem}
  .status.busy::before{content:"";display:inline-block;width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--save);border-radius:50%;margin-right:8px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.status.busy::before{animation:none;border-top-color:var(--line);background:var(--save)}}
  .result-list{display:grid;gap:8px;margin-top:12px}
  .result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px}
  .result .name{font-family:var(--serif);font-size:1.15rem;font-weight:600;line-height:1.15}
  .result .meta{color:var(--ink-2);font-size:.84rem;margin-top:4px}.result .distance{font-family:var(--mono);font-size:.68rem;color:var(--save);margin-top:5px}
  .evidence-list{display:grid;gap:8px;margin-top:12px}.evidence{border-left:3px solid var(--save);padding:9px 11px;background:var(--card);border-radius:0 8px 8px 0}
  .evidence .label{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--save)}
  .evidence .detail{margin-top:3px;font-size:.92rem}.source{display:inline-block;font-size:.76rem;margin-top:5px;color:var(--ink-2);overflow-wrap:anywhere}
  .question-list{margin:10px 0 0;padding-left:20px;color:var(--ink-2);font-size:.9rem}.question-list li{margin:6px 0}
  .connection{max-width:520px}.connection .row{margin-top:14px}.privacy-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .location-help{border-left:3px solid var(--leak);background:var(--leak-lite);padding:14px 16px;margin:14px 0;color:var(--ink-2)}
  .location-help h2{font-family:var(--serif);font-size:1.25rem;line-height:1.15;color:var(--ink);margin:0 0 6px}
  .location-help p{font-size:.9rem;margin:6px 0}.location-help strong{color:var(--ink)}
  .location-steps{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:12px 0}
  .location-step{font-size:.86rem;line-height:1.45}.location-step .lab{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leak);display:block;margin-bottom:3px}
  .location-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .obs-source{display:block;font-size:.74rem;margin:4px 42px 0 118px;overflow-wrap:anywhere}
  /* ---------- business list ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin:12px 0}
  .biz{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
  .biz .name{font-family:var(--serif);font-size:1.28rem;font-weight:600;line-height:1.1}
  .biz .cat{color:var(--ink-2);font-size:.9rem;margin-top:2px}
  .pill{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.24rem .55rem;border-radius:999px;vertical-align:middle;margin-left:8px}
  .pill.food{background:var(--leak-lite);color:var(--leak)} .pill.service{background:var(--save-lite);color:var(--save)}
  .biz .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .empty{text-align:center;color:var(--ink-3);padding:48px 16px}
  /* ---------- editor ---------- */
  label.f{display:block;margin:14px 0 0}
  label.f .lab{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:5px}
  input,textarea,select{width:100%;font-family:var(--sans);font-size:1rem;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:.62rem .7rem}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--save-lite);border-color:var(--save)}
  textarea{min-height:60px;resize:vertical;line-height:1.4}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:560px){
    .appbar{flex-wrap:wrap}
    .biz{grid-template-columns:1fr}
    .biz .acts{justify-content:flex-start}
    .grid2{grid-template-columns:1fr}
    .grid3{grid-template-columns:1fr 1fr}
    .obs-row{grid-template-columns:84px minmax(0,1fr) auto}
    .obs-source{margin-left:92px}
    .search-tools{grid-template-columns:1fr}.search-tools .btn{width:100%}
    .result{grid-template-columns:1fr}.result .btn{justify-self:start}
    .location-steps{grid-template-columns:1fr}
  }
  @media(max-width:400px){.grid3{grid-template-columns:1fr}}
  .obs-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:start;margin-top:8px}
  .obs-row .btn{padding:.5rem .6rem}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;padding:.55rem 1rem;font-weight:600;cursor:pointer;color:var(--ink-2);font-family:var(--sans);font-size:.92rem}
  .seg button.on{background:var(--save);color:#fff}
  .section-title{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 4px;border-top:1px solid var(--line);padding-top:18px}
  .savebar{position:sticky;bottom:0;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);
    padding:12px clamp(16px,5vw,28px);padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:flex-end}
  /* ---------- owner conversation brief ---------- */
  .brief-wrap{max-width:880px;margin:0 auto;padding:clamp(20px,5vw,42px);padding-bottom:max(72px,env(safe-area-inset-bottom))}
  .brief-hero{padding:8px 0 26px;border-bottom:1px solid var(--line)}
  .brief-kicker{font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--save);font-weight:700}
  .brief-hero h2{font-family:var(--serif);font-size:clamp(2rem,5vw,3.3rem);line-height:1.03;margin:.5rem 0 0;font-weight:600;text-wrap:balance}
  .brief-hero .lead{max-width:68ch}
  .brief-route{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:thin}
  .brief-route button{white-space:nowrap;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:0;border-bottom:2px solid var(--line);background:transparent;padding:.35rem .15rem;cursor:pointer}
  .brief-route button:hover{color:var(--save);border-color:var(--save)}
  .brief-route button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .brief-section{padding:30px 0;border-bottom:1px solid var(--line);scroll-margin-top:92px}
  .brief-section:last-child{border-bottom:0}
  .brief-step{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--save);font-weight:700}
  .brief-section h2{font-family:var(--serif);font-size:clamp(1.55rem,4vw,2.15rem);line-height:1.1;margin:.45rem 0 0;font-weight:600}
  .brief-section h3{font-family:var(--serif);font-size:1.15rem;line-height:1.2;margin:0;font-weight:600}
  .brief-copy{color:var(--ink-2);max-width:72ch;margin:.65rem 0 0}
  .brief-say{border-left:4px solid var(--save);background:var(--save-lite);padding:18px 20px;margin:18px 0 0}
  .brief-say.warm{border-left-color:var(--leak);background:var(--leak-lite)}
  .brief-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;color:var(--save);font-weight:700;display:block;margin-bottom:.45rem}
  .brief-say.warm .brief-label{color:var(--leak)}
  .brief-say p{font-family:var(--serif);font-size:1.15rem;line-height:1.48;margin:0}
  .brief-list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:0}
  .brief-list li{padding:12px 0 12px 20px;border-top:1px solid var(--line);position:relative;color:var(--ink-2)}
  .brief-list li::before{content:"";position:absolute;left:2px;top:1.32rem;width:6px;height:6px;border-radius:50%;background:var(--save)}
  .brief-list strong{color:var(--ink)}
  .brief-findings,.brief-questions,.brief-plan{margin-top:18px;border-top:1px solid var(--line)}
  .brief-finding,.brief-question,.brief-plan-row{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(150px,.65fr) minmax(0,1.7fr);gap:22px}
  .brief-finding p,.brief-question p,.brief-plan-row p{margin:.35rem 0 0;color:var(--ink-2);font-size:.92rem}
  .brief-confirm,.brief-listen{font-family:var(--mono);font-size:.67rem;line-height:1.45;color:var(--save);margin-top:.55rem}
  .brief-table-wrap{overflow-x:auto;margin-top:18px;border-top:1px solid var(--line)}
  .brief-table{width:100%;border-collapse:collapse;min-width:560px;font-variant-numeric:tabular-nums}
  .brief-table th,.brief-table td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--line);font-size:.86rem}
  .brief-table th:first-child,.brief-table td:first-child{text-align:left;padding-left:0}
  .brief-table th{font-family:var(--mono);font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .brief-table td:not(:first-child){font-weight:700;color:var(--save)}
  .brief-proof{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
  .brief-proof>div{border-top:3px solid var(--save);padding-top:10px}
  .brief-proof p{font-size:.88rem;color:var(--ink-2);margin:.4rem 0 0}
  .brief-details{margin-top:16px;border-top:1px solid var(--line)}
  .brief-details details{border-bottom:1px solid var(--line);padding:12px 0}
  .brief-details summary{cursor:pointer;font-weight:700;color:var(--ink)}
  .brief-details summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .brief-source-list{display:grid;gap:8px;margin:12px 0 4px}.brief-source-list a{overflow-wrap:anywhere;font-size:.86rem}
  .brief-note{margin-top:16px;padding:12px 14px;border-left:3px solid var(--gold);background:#F4EEDC;color:var(--ink-2);font-size:.88rem}
  @media(max-width:600px){
    .brief-wrap{padding:18px 18px 78px}.brief-section{padding:26px 0}.brief-say{padding:15px 16px}
    .brief-finding,.brief-question,.brief-plan-row{grid-template-columns:1fr;gap:5px}.brief-proof{grid-template-columns:1fr}
    .brief-route{margin-right:-18px;padding-right:18px}.brief-hero h2{font-size:2.15rem}
    .brief-appbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;flex-wrap:nowrap;gap:8px}
    .brief-appbar .sp{display:none}.brief-appbar .btn{padding:.48rem .6rem}.brief-appbar h1{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brief-table-wrap{overflow:visible}.brief-table{min-width:0}.brief-table thead{display:none}
    .brief-table tbody,.brief-table tr,.brief-table td{display:block;width:100%}.brief-table tr{padding:10px 0;border-bottom:1px solid var(--line)}
    .brief-table td,.brief-table td:first-child{text-align:right;padding:4px 0;border:0;display:flex;justify-content:space-between;gap:14px}
    .brief-table td:first-child{font-family:var(--serif);font-size:1.05rem;font-weight:700;color:var(--ink);padding-bottom:7px}
    .brief-table td:nth-child(2)::before{content:"Per $1,000"}.brief-table td:nth-child(3)::before{content:"Per $5,000"}.brief-table td:nth-child(4)::before{content:"Per $10,000"}
    .brief-table td:not(:first-child)::before{font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  }
  .prepared-briefs{padding:0 0 24px;margin-bottom:24px;border-bottom:1px solid var(--line)}
  .prepared-briefs h2{font-size:1rem;margin:0 0 12px;letter-spacing:0}
  .prepared-brief{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
  .prepared-brief h3{font-family:var(--serif);font-size:1.3rem;margin:0;overflow-wrap:anywhere}
  .prepared-brief p{font-size:.85rem;color:var(--ink-2);margin:5px 0 0}
  .prepared-brief .btn{flex-shrink:0}
  .systems-brief h1,.systems-brief h2{font-size:1.6rem;letter-spacing:0;overflow-wrap:anywhere}
  .systems-brief .brief-hero h1{font-family:var(--serif);font-size:2.15rem;line-height:1.03;margin:.5rem 0 0;font-weight:600;text-wrap:balance}
  .systems-brief .lead{font-size:1.05rem}
  .systems-brief .brief-kicker,.systems-brief .brief-step,.systems-brief .brief-label{letter-spacing:0}
  .systems-brief .brief-route{flex-wrap:wrap;overflow:visible;margin-right:0;padding-right:0}
  .systems-brief .brief-route button{min-height:44px;font-size:.72rem;letter-spacing:0}
  .systems-brief .brief-note{background:var(--save-lite);border-color:var(--save)}
  @media(max-width:420px){.prepared-brief{align-items:flex-start;flex-direction:column}}
  /* ---------- present (deck) — same design as the standalone package ---------- */
  #present{position:fixed;inset:0;background:var(--paper);z-index:50;display:none}
  #present.on{display:block}
  #present .deck{position:relative;height:100%;width:100%}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(26px,6vw,84px);
    padding-top:max(56px,env(safe-area-inset-top));opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .45s,transform .45s;max-width:1160px;margin:0 auto}
  .slide.active{opacity:1;transform:none;pointer-events:auto}
  @media(prefers-reduced-motion:reduce){.slide{transition:none}}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--save);font-weight:600;margin:0 0 .9rem;display:flex;align-items:center;gap:.6rem}
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--save)} .eyebrow.warm{color:var(--leak)} .eyebrow.warm::before{background:var(--leak)}
  .slide h2,.slide h1{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
  .slide h1{font-size:clamp(2rem,5.4vw,3.7rem);line-height:1.04}.slide h2{font-size:clamp(1.6rem,3.9vw,2.7rem);line-height:1.1}
  .lead{font-size:clamp(1rem,1.7vw,1.2rem);color:var(--ink-2);max-width:62ch;margin:.9rem 0 0}
  .fine{font-size:.8rem;color:var(--ink-3)} .slide strong{color:var(--ink);font-weight:600}.save-ink{color:var(--save);font-weight:600}
  .facts{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.45rem;max-width:66ch}
  .facts li{display:grid;grid-template-columns:auto 1fr;gap:.8rem;padding:.58rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .facts .tg{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-top:.25rem}
  .fact-source{display:block;font-family:var(--mono);font-size:.56rem;line-height:1.35;color:var(--ink-3);margin-top:.32rem}
  .fact-source a{color:var(--ink-3);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
  .pmatrix{display:grid;margin-top:1.2rem;max-width:980px;border-top:1px solid var(--line)}
  .pmatrix-row{display:grid;grid-template-columns:minmax(108px,.7fr) minmax(210px,1.5fr) minmax(170px,1fr);gap:14px;padding:.68rem 0;border-bottom:1px solid var(--line);align-items:start}
  .pmatrix-row.head{font-family:var(--mono);font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:.48rem 0}
  .pmatrix-row .channel{font-family:var(--serif);font-size:1.02rem;font-weight:600;line-height:1.15}.pmatrix-row .role,.pmatrix-row .decision{font-size:.82rem;line-height:1.42;color:var(--ink-2)}
  .pmatrix-row .decision strong{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--save);display:block;margin-bottom:.14rem}
  .pmath{display:grid;margin-top:1.15rem;max-width:900px;border-top:1px solid var(--line)}
  .pmath-row{display:grid;grid-template-columns:minmax(145px,.75fr) minmax(0,1.8fr);gap:16px;padding:.68rem 0;border-bottom:1px solid var(--line)}
  .pmath-row .name{font-family:var(--serif);font-weight:600}.pmath-row .formula{font-family:var(--mono);font-size:.7rem;line-height:1.5;color:var(--ink-2)}
  .paudiences{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:1rem;max-width:980px;border-top:1px solid var(--line)}
  .paudience{padding:.7rem 0;border-bottom:1px solid var(--line)}.paudience .who{font-family:var(--serif);font-size:1rem;font-weight:600}
  .paudience .next{font-size:.82rem;color:var(--ink-2);line-height:1.4;margin-top:.18rem}.paudience .metric{font-family:var(--mono);font-size:.59rem;color:var(--save);margin-top:.28rem}
  .proadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:1.25rem;max-width:980px}
  .proad{border-top:3px solid var(--save);padding:.7rem .15rem 0}.proad .when{font-family:var(--mono);font-size:.59rem;letter-spacing:.08em;text-transform:uppercase;color:var(--save)}

async function executeDiscoverySearch(query){
  if(discoverState.busy)return;

    if(!discoverState.location){discoverState.busy="Getting your approximate location…";renderDiscover();discoverState.location=await Discovery.getApproximateLocation();}
    discoverState.busy=discoverState.query?`Searching near you for “${discoverState.query}”…`:"Finding restaurants near you…";renderDiscover();
    const result=await Discovery.searchBusinesses({query:discoverState.query,location:discoverState.location,radiusMiles:radius});
    discoverState.places=Array.isArray(result.places)?result.places:[];discoverState.hasSearched=true;discoverState.message=`${discoverState.places.length} restaurant${discoverState.places.length===1?"":"s"} found.`;
  }catch(error){discoverState.error=error.message;discoverState.locationIssue=error?.code==="LOCATION_PERMISSION_DENIED"?"denied":"";discoverState.places=[];}finally{discoverState.busy="";renderDiscover();}

function stage(id){

function briefSources(b){
 const all=[...(b.research?.sources||[]),...(b.observed||[]).flatMap(factSources)];const seen=new Set();
 return all.filter(source=>{if(!source?.url||seen.has(source.url))return false;seen.add(source.url);return true;});

function renderOwnerBrief(id){
 const b=PUBLIC_BRIEFS.find(item=>item.id===id)||getBiz(id);if(!b?.ownerBrief){location.hash=b?`#/edit/${id}`:"#/";return;}
 if(b.ownerBrief.kind==="systems")return renderSystemsBrief(b);
 const brief=b.ownerBrief;const findings=Array.isArray(brief.findings)?brief.findings:[];const questions=Array.isArray(brief.questions)?brief.questions:[];
 const solutions=Array.isArray(b.solutionCards)?b.solutionCards:[];const audiences=Array.isArray(b.audiences)?b.audiences:[];
 const inputs=Array.isArray(b.ownerInputs)?b.ownerInputs:[];const metrics=Array.isArray(b.metrics)?b.metrics:[];const sources=briefSources(b);

function closePresent(){document.getElementById("present").classList.remove("on");document.getElementById("present").setAttribute("aria-hidden","true");if(location.hash.startsWith("#/present"))location.hash=preturn;else router();}
function pgo(i){const S=[...document.querySelectorAll("#deck .slide")];if(!S.length)return;i=Math.max(0,Math.min(S.length-1,i));if(i===pcur)return;
  S.forEach((s,k)=>s.classList.toggle("active",k===i));document.getElementById("pcount").textContent=(i+1)+" / "+S.length;pcur=i;
  S[i].querySelectorAll(".pfill").forEach(f=>{f.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width=f.dataset.w+"%"));});}
addEventListener("keydown",e=>{if(!document.getElementById("present").classList.contains("on"))return;
  if(e.key==="ArrowRight"||e.key===" ")pgo(pcur+1);else if(e.key==="ArrowLeft")pgo(pcur-1);else if(e.key==="Escape")closePresent();});
let psx=null;document.getElementById("present").addEventListener("touchstart",e=>psx=e.touches[0].clientX,{passive:true});
document.getElementById("present").addEventListener("touchend",e=>{if(psx==null)return;const dx=e.changedTouches[0].clientX-psx;if(Math.abs(dx)>50)pgo(pcur+(dx<0?1:-1));psx=null;},{passive:true});

function foodSols(b){
  if(Array.isArray(b.solutionCards)&&b.solutionCards.length)return b.solutionCards.slice(0,3);
  const direct=1000*b.directRate,keptLo=1000*b.commissionLow-direct,keptHi=1000*b.commissionHigh-direct;
  const s=[
    {title:"Win delivery regulars back",fix:"A card + QR in every delivery bag inviting customers to order direct next time — landing on your own ordering where they opt in and become yours.",benefit:"app orders → your customers"},
    {title:"Your own ordering + loyalty",fix:"The direct link they land on — priced at your own rate, building the list you own and can actually market to.",benefit:`keep ~${money(keptLo)}–${money(keptHi)} / $1,000`},
    {title:"Unify counter + online + catering",fix:"One checkout and one dashboard across the counter, online orders, and catering.",benefit:"one customer view"},
  ];
  return s.slice(0,3);
}
function serviceSols(b){
  const cardNow=b.onlineVolume*b.currentRate+b.onlineTxns*(b.currentFixed||.30),cardAfter=b.onlineVolume*(b.stripeRate||.029)+b.onlineTxns*(b.stripeFixed||.30);
  const cardSave=Math.max(0,cardNow-cardAfter),noShowRec=b.servicesMo*b.noShowRate*b.avgTicket*(b.noShowRecoverPct||.70);
  const s=[];
  if(cardSave>0)s.push({title:"Direct checkout",fix:"Off the platform's stacked fee and onto a direct rate you keep.",benefit:`${money(cardSave)}/mo back`});
  if(noShowRec>0)s.push({title:"Deposits + auto-reminders",fix:"Hold each slot with a deposit and cut no-shows with automatic reminders.",benefit:`${money(noShowRec)}/mo recovered`});
  if((b.saasReducibleMo||0)>0||b.adminHoursMo>0)s.push({title:"Consolidate + automate",fix:"Replace the scattered tools with one flow that runs the busywork for you.",benefit:`${money(b.saasReducibleMo||0)}/mo${b.adminHoursMo?` + ${b.adminHoursMo} hrs`:""}`});
  if(!s.length)s.push({title:"One connected system",fix:"Booking, payment, and follow-up brought into one place.",benefit:"less busywork"});
  return s.slice(0,3);
}

     <div class="pbar"><span class="lab">Assumed direct processing</span><div class="ptrack"><div class="pfill save" data-w="${(direct/appMid*100).toFixed(1)}"></div></div><span class="val save">${money(direct)}</span></div></div>
     <div class="pstats"><div class="pstat"><div class="n save">${money(keptLo)}–${money(keptHi)}</div><div class="k">gross fee difference per $1,000 shifted to owned pickup</div></div></div>
     <p class="fine" style="margin-top:1rem">Scenario only: published DoorDash tiers are 15–30% and U.S. Uber Eats tiers are 20–30%. This uses an unconfirmed ~${(b.directRate*100).toFixed(1)}% direct-processing assumption before fixed fees. If the order remains delivery, subtract direct-fulfillment and added operating costs. <a href="https://merchants.doordash.com/en-us/marketplace/how-it-works-for-restaurants" target="_blank" rel="noopener noreferrer">DoorDash pricing</a> · <a href="https://merchants.ubereats.com/us/en/pricing/" target="_blank" rel="noopener noreferrer">Uber Eats pricing</a></p></section>`;
  if(detailed)return [
   cover(b,`${bizName(b)} does not need another storefront. It needs one consent-aware customer system behind the storefronts it already has.`),
   `<section class="slide"><p class="eyebrow">What I can already verify</p><h2>${bizName(b)} has more owned infrastructure than it appears.</h2><p class="lead">Public facts only — every item links to its source:</p>${factsList(b,(b.observed||[]).slice(0,4))}</section>`,
   `<section class="slide"><p class="eyebrow warm">What needs protection first</p><h2>${bizName(b)} has permission to build loyalty — and public paths to clean up.</h2><p class="lead">These two facts shape the safest first phase:</p>${factsList(b,(b.observed||[]).slice(4,6))}<p class="fine" style="margin-top:1rem">Fix the public front door, then build follow-up only from owned, opted-in relationships.</p></section>`,
   foodSystemSlide(b),scenario,foodEconomicsSlide(b),foodArchitectureSlide(b),foodAudienceSlide(b),foodRoadmapSlide(b),
   solutionsSlide(foodSols(b)),foodInputsSlide(b),
   askSlide(b,["Open one ordinary month of marketplace, POS, website, membership, and catering records.","I replace every assumption with your actual channel economics.","We leave with a phased keep, connect, replace, or do-nothing plan."])
  ];
  return [
   cover(b,"You've built something people seek out. Here's where revenue quietly leaks — and how to keep more of what you already earn."),
   `<section class="slide"><p class="eyebrow">What I can already see</p><h2>I looked at your setup first.</h2><p class="lead">All public — from your ordering pages and delivery listings:</p>${factsList(b)}</section>`,
   scenario,
   `<section class="slide"><p class="eyebrow warm">Leaking now · scattered ordering</p><h2>Customers reach you through several public ordering paths.</h2><div class="pchips">${(b.surfaces||[]).map(s=>`<span class="pchip">${esc(s)}</span>`).join("")}</div><p class="lead" style="margin-top:1.4rem">Each one can split sales data, repeat customers, and the brand — and add hours reconciling payouts.</p></section>`,
   `<section class="slide"><p class="eyebrow">The fix · one home you own</p><h2>One ordering home that builds your list.</h2><div class="pflow"><div class="pstep"><span class="s">01</span><b>Order</b></div><div class="parrow">→</div><div class="pstep"><span class="s">02</span><b>Pay</b></div><div class="parrow">→</div><div class="pstep"><span class="s">03</span><b>Opt in</b></div><div class="parrow">→</div><div class="pstep"><span class="s">04</span><b>Reorder direct</b></div><div class="parrow">→</div><div class="pstep"><span class="s">05</span><b>One dashboard</b></div></div></section>`,
   solutionsSlide(foodSols(b)),askSlide(b,["Bring recent marketplace payout reports and a month of card statements.","I turn every rate here into actual dollars.","You leave knowing exactly where the money is."])
  ];
}
function serviceSlides(b){
  const cardNow=b.onlineVolume*b.currentRate+b.onlineTxns*(b.currentFixed||.30);
  const cardAfter=b.onlineVolume*(b.stripeRate||.029)+b.onlineTxns*(b.stripeFixed||.30);
  const cardSave=Math.max(0,cardNow-cardAfter);
  const noShowLoss=b.servicesMo*b.noShowRate*b.avgTicket, noShowRec=noShowLoss*(b.noShowRecoverPct||.70);
  const timeVal=b.adminHoursMo*b.hourlyValue, hard=cardSave+ (b.saasReducibleMo||0) + noShowRec;
  const payback=hard>0?b.buildFee/hard:null, mx=Math.max(cardNow,cardAfter,1);
  return [
   cover(b,"Where your money and your hours are quietly going — and what one connected system gives back."),
   `<section class="slide"><p class="eyebrow">What I can already see</p><h2>I looked before I knocked.</h2>
     <p class="lead">All public — from your site, booking page, and checkout:</p>${factsList(b)}</section>`,
   `<section class="slide"><p class="eyebrow warm">Leaking now · the small, checkable one</p><h2>You're paying a platform tax on every online sale.</h2>
     <p class="lead">Published pricing suggests a payment-cost gap worth checking against a direct checkout.</p>
     <div class="pbars"><div class="pbar"><span class="lab">Now</span><div class="ptrack"><div class="pfill leak" data-w="100"></div></div><span class="val leak">${money(cardNow)}</span></div>
     <div class="pbar"><span class="lab">Direct</span><div class="ptrack"><div class="pfill save" data-w="${(cardAfter/mx*100).toFixed(1)}"></div></div><span class="val save">${money(cardAfter)}</span></div></div>
     <div class="pstats"><div class="pstat"><div class="n save">${money(cardSave)}</div><div class="k">back / month</div></div><div class="pstat"><div class="n save">${money(cardSave*12)}</div><div class="k">back / year</div></div></div>
     <p class="fine" style="margin-top:1rem">Small — but checkable on your own statement. That's the point: only what's true.</p></section>`,
   `<section class="slide"><p class="eyebrow warm">Leaking now · the bigger one</p><h2>The real cost is the hours and the empty chairs.</h2>
     <div class="pstats"><div class="pstat"><div class="n leak">${money(noShowLoss)}</div><div class="k">missed / month<br>(${b.servicesMo} · ${Math.round(b.noShowRate*100)}% · ${money(b.avgTicket)})</div></div>
     <div class="pstat"><div class="n leak">${money(b.saasReducibleMo||0)}</div><div class="k">tools / month</div></div>
     <div class="pstat"><div class="n leak">${b.adminHoursMo} hrs</div><div class="k">/ month by hand</div></div></div>
     <p class="lead" style="margin-top:1.4rem">Deposits + automatic reminders recover most missed appointments; one flow removes the copy-paste.</p></section>`,
   `<section class="slide"><p class="eyebrow">The fix · one connected system</p><h2>Everything from "book me" to "come back" in one flow.</h2>
     <div class="pflow"><div class="pstep"><span class="s">01</span><b>Book</b></div><div class="parrow">→</div><div class="pstep"><span class="s">02</span><b>Deposit</b></div><div class="parrow">→</div><div class="pstep"><span class="s">03</span><b>Reminders</b></div><div class="parrow">→</div><div class="pstep"><span class="s">04</span><b>Rebook</b></div><div class="parrow">→</div><div class="pstep"><span class="s">05</span><b>One record</b></div></div>
     <p class="lead" style="margin-top:1.4rem">One system built around how you already work.</p></section>`,
   solutionsSlide(serviceSols(b)),
   `<section class="slide"><p class="eyebrow">The bottom line</p><h2>What one system gives back each month.</h2>
     <div class="pstats"><div class="pstat"><div class="phead">${money(hard)}</div><div class="k">hard dollars back / month</div></div></div>
     <p class="lead" style="margin-top:.6rem"><strong>${money(hard)}/mo</strong> before counting ~${b.adminHoursMo} hrs back${payback?` — a ${money(b.buildFee)} system pays for itself in about <span class="save-ink">${payback.toFixed(1)} months</span>`:""}.</p></section>`,
   askSlide(b,["Bring one month of card statements and a rough sense of your no-shows.","I replace every estimate here with your actual figures.","You leave knowing the number — build or not."]),
  ];
}
router();
